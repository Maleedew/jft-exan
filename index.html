let deck,i,score,wrong,done;
const $=id=>document.getElementById(id);
const sh=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]]}return a};
function start(cards,rand){deck=rand?sh(cards):cards.slice();i=0;score=0;wrong=[];show()}
function show(){
  if(i>=deck.length)return result();
  const c=deck[i],opts=sh([c.a,...c.d]);done=false;
  $('pos').textContent=`කාඩ් ${i+1} / ${deck.length}`;$('sc').textContent=`ලකුණු: ${score}`;$('pg').style.width=(i/deck.length*100)+'%';
  $('main').innerHTML=`<div class="card"><span class="tag">ප්‍රශ්නය ${c.n}</span>${c.img?`<img src="${IMGS[c.img]}" alt="">`:''}<div class="q">${c.q}</div><div id="ops"></div><div id="fb"></div></div>`;
  opts.forEach(t=>{const b=document.createElement('button');b.className='o';b.textContent=t;b.onclick=()=>pick(b,t,c);$('ops').appendChild(b)});
}
function pick(b,t,c){
  if(done)return;done=true;const ok=t===c.a;
  document.querySelectorAll('.o').forEach(x=>{x.disabled=true;if(x.textContent===c.a)x.classList.add('ok')});
  if(ok)score++;else{b.classList.add('no');wrong.push(c)}
  $('sc').textContent=`ලකුණු: ${score}`;
  $('fb').innerHTML=`<div class="fb" style="color:var(${ok?'--ok':'--no'})">${ok?'✅ නිවැරදියි!':'❌ වැරදියි — නිවැරදි පිළිතුර ඉහළින් කොළපාටින්'}</div><button class="nx" id="nx">${i+1<deck.length?'ඊළඟ කාඩ් එක →':'ප්‍රතිඵල බලන්න'}</button>`;
  $('nx').onclick=()=>{i++;show()};$('nx').focus();
}
function result(){
  $('pg').style.width='100%';$('pos').textContent='අවසානයි';
  const p=Math.round(score/deck.length*100);
  $('main').innerHTML=`<div class="card res"><div class="big">${p}%</div><p>${deck.length} න් ${score} නිවැරදියි 🎉</p>
  ${wrong.length?`<button class="btn" id="rw">වැරදි ${wrong.length} නැවත කරන්න</button>`:''}<button class="btn s" id="ra">සියල්ල නැවත (අහඹු)</button>
  ${wrong.length?'<div style="margin-top:14px">'+wrong.map(c=>`<div class="rv">ප්‍රශ්නය ${c.n}: ${c.q}<br><b>✔ ${c.a}</b></div>`).join('')+'</div>':''}</div>`;
  if(wrong.length)$('rw').onclick=()=>start(wrong,true);
  $('ra').onclick=()=>start(CARDS,true);
}
$('shuf').onclick=()=>start(CARDS,true);$('rst').onclick=()=>start(CARDS,false);
start(CARDS,false);
</script></body></html>
